<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>Timeline Visualizer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#101114;color:#f5f5f7}.wrap{max-width:760px;margin:auto;padding:16px}h1{font-size:24px}.card{background:#1c1d21;border-radius:16px;padding:14px;margin:12px 0}button,input,select{font:inherit;border:0;border-radius:10px;padding:11px;margin:4px;background:#2b2d32;color:white}button{background:#3976f6;font-weight:650}button:disabled{opacity:.4}#map{height:48vh;min-height:330px;border-radius:14px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.grow{flex:1}.muted{color:#aaa}.progress{height:5px;background:#333;border-radius:4px;overflow:hidden}.bar{height:100%;width:0;background:#fff}a{color:#8ab4ff}</style></head><body><div class="wrap"><h1>Timeline Visualizer</h1><div class="card"><input id="file" type="file" accept=".json,application/json"><div id="status" class="muted">Timeline.json을 선택하세요. 파일은 서버로 업로드되지 않습니다.</div></div><div class="card"><div class="row"><label>시작 <input id="from" type="date"></label><label>끝 <input id="to" type="date"></label></div><div class="row"><label>이름 <input id="name" value="My"></label><label>제목 <input id="title" value="{year} {name} Timeline"></label></div><div class="row"><label>재생 <input id="seconds" type="number" min="10" max="300" value="30" style="width:65px">초</label><label>화질 <select id="quality"><option value="480">480p</option><option value="720">720p</option><option value="1080" selected>1080p</option></select></label><label><input id="filter" type="checkbox" checked> GPS 이상치 필터</label></div><div class="row"><button id="apply">기간 적용</button><button id="play">미리보기</button><button id="image">전체 경로 이미지</button><button id="video">영상 만들기</button></div><div class="progress"><div id="bar" class="bar"></div></div></div><div id="map"></div><div class="card muted">iPhone Safari용 개인 웹 버전 · JSON은 브라우저 내부에서만 처리됩니다. 영상은 Safari가 지원하는 형식으로 생성됩니다.</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id);let pts=[],shown=[],map=L.map('map',{zoomControl:true}).setView([37.56,126.97],7),line=L.polyline([],{color:'#ff3b30',weight:4}).addTo(map),marker=L.circleMarker([0,0],{radius:7,color:'#fff',fillColor:'#3976f6',fillOpacity:1,weight:2}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
function coord(v){if(!v)return null;if(typeof v==='string'){let m=v.match(/(-?\d+(?:\.\d+)?)\s*°?\s*,\s*(-?\d+(?:\.\d+)?)/)||v.match(/geo:(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return [+m[1],+m[2]]}if(v.latitudeE7!=null)return [v.latitudeE7/1e7,v.longitudeE7/1e7];if(v.latE7!=null)return [v.latE7/1e7,v.lngE7/1e7];if(v.latitude!=null&&v.longitude!=null)return [+v.latitude,+v.longitude];return null}
function walk(o,t){if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(x=>walk(x,t));return}let time=o.timestamp||o.time||o.startTime||o.startTimestamp||o.duration?.startTimestamp||o.duration?.startTimestampMs||t;let c=coord(o.latLng)||coord(o.location)||coord(o.startLocation)||coord(o.visit?.topCandidate?.placeLocation)||coord(o.activity?.start);if(c&&Math.abs(c[0])<=90&&Math.abs(c[1])<=180)pts.push({lat:c[0],lng:c[1],t:time?new Date(isNaN(time)?time:+time).getTime():Date.now()});for(const [k,v] of Object.entries(o))if(!['latLng','location','startLocation'].includes(k))walk(v,time)}
function hav(a,b){let R=6371,p=Math.PI/180,dlat=(b.lat-a.lat)*p,dl=(b.lng-a.lng)*p,s=Math.sin(dlat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function filtered(a){if(!$('filter').checked||a.length<3)return a;return a.filter((p,i)=>{if(!i||i===a.length-1)return true;let dt=Math.max(1,(a[i+1].t-a[i-1].t)/3600000),d=hav(a[i-1],p)+hav(p,a[i+1]);return d/dt<1200})}
function apply(){if(!pts.length)return;let f=$('from').value?new Date($('from').value+'T00:00:00').getTime():0,t=$('to').value?new Date($('to').value+'T23:59:59').getTime():Infinity;shown=filtered(pts.filter(p=>p.t>=f&&p.t<=t));line.setLatLngs(shown.map(p=>[p.lat,p.lng]));if(shown.length){map.fitBounds(line.getBounds(),{padding:[20,20]});marker.setLatLng([shown[0].lat,shown[0].lng])}$('status').textContent=`${shown.length.toLocaleString()}개 위치 표시 중`}
$('file').onchange=async e=>{try{pts=[];let j=JSON.parse(await e.target.files[0].text());walk(j);pts=pts.filter((p,i,a)=>!i||p.lat!==a[i-1].lat||p.lng!==a[i-1].lng).sort((a,b)=>a.t-b.t);if(!pts.length)throw Error('위치 데이터를 찾지 못했습니다');let a=new Date(pts[0].t),b=new Date(pts.at(-1).t);$('from').value=a.toISOString().slice(0,10);$('to').value=b.toISOString().slice(0,10);apply()}catch(x){$('status').textContent='불러오기 실패: '+x.message}};$('apply').onclick=apply;$('filter').onchange=apply;
$('play').onclick=()=>{if(!shown.length)return;let start=performance.now(),dur=Math.max(3,+$('seconds').value)*1000;line.setLatLngs([]);function f(now){let q=Math.min(1,(now-start)/dur),n=Math.max(1,Math.floor(q*shown.length)),a=shown.slice(0,n);line.setLatLngs(a.map(p=>[p.lat,p.lng]));let p=a.at(-1);marker.setLatLng([p.lat,p.lng]);map.panTo([p.lat,p.lng],{animate:false});$('bar').style.width=q*100+'%';if(q<1)requestAnimationFrame(f);else{line.setLatLngs(shown.map(p=>[p.lat,p.lng]));map.fitBounds(line.getBounds(),{padding:[20,20]})}}requestAnimationFrame(f)};
function canvas(){let s=+$('quality').value,c=document.createElement('canvas');c.width=c.height=s;return c}function project(c,p,b){let x=(p.lng-b.minLng)/(b.maxLng-b.minLng||1),y=1-(p.lat-b.minLat)/(b.maxLat-b.minLat||1);return [50+x*(c.width-100),70+y*(c.height-140)]}function bounds(){return {minLat:Math.min(...shown.map(p=>p.lat)),maxLat:Math.max(...shown.map(p=>p.lat)),minLng:Math.min(...shown.map(p=>p.lng)),maxLng:Math.max(...shown.map(p=>p.lng))}}function draw(c,n){let x=c.getContext('2d'),b=bounds();x.fillStyle='#eef1f4';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#d2d7dc';x.lineWidth=1;for(let i=0;i<10;i++){x.beginPath();x.moveTo(i*c.width/10,0);x.lineTo(i*c.width/10,c.height);x.stroke();x.beginPath();x.moveTo(0,i*c.height/10);x.lineTo(c.width,i*c.height/10);x.stroke()}x.strokeStyle='#ff3b30';x.lineWidth=Math.max(3,c.width/240);x.lineJoin='round';x.beginPath();shown.slice(0,n).forEach((p,i)=>{let q=project(c,p,b);i?x.lineTo(...q):x.moveTo(...q)});x.stroke();if(n){let q=project(c,shown[n-1],b);x.fillStyle='#3976f6';x.beginPath();x.arc(...q,c.width/90,0,7);x.fill()}x.fillStyle='#111';x.font=`600 ${c.width/28}px -apple-system`;let y=new Date(shown[0]?.t||Date.now()).getFullYear(),tt=$('title').value.replace('{year}',y).replace('{name}',$('name').value);x.fillText(tt,35,50)}
$('image').onclick=()=>{if(!shown.length)return;let c=canvas();draw(c,shown.length);c.toBlob(b=>save(b,'timeline.png'),'image/png')};function save(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
$('video').onclick=async()=>{if(!shown.length)return;let c=canvas(),fps=30,dur=Math.max(10,Math.min(300,+$('seconds').value)),stream=c.captureStream(fps),mime=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':'video/webm',rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>save(new Blob(chunks,{type:mime}),'timeline.'+(mime.includes('mp4')?'mp4':'webm'));rec.start();let start=performance.now();await new Promise(resolve=>{function f(now){let q=Math.min(1,(now-start)/(dur*1000)),n=Math.max(1,Math.floor(q*shown.length));draw(c,n);$('bar').style.width=q*100+'%';q<1?requestAnimationFrame(f):resolve()}requestAnimationFrame(f)});rec.stop()};
</script></body></html>
