<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>Timeline Visualizer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#101114;color:#f5f5f7}.wrap{max-width:760px;margin:auto;padding:16px}h1{font-size:24px}.card{background:#1c1d21;border-radius:16px;padding:14px;margin:12px 0}button,input,select{font:inherit;border:0;border-radius:10px;padding:11px;margin:4px;background:#2b2d32;color:white}button{background:#3976f6;font-weight:650;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}#map{height:48vh;min-height:330px;border-radius:14px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.muted{color:#aaa}.progress{height:5px;background:#333;border-radius:4px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#fff}.credit{text-align:center;color:#8f939b;font-size:13px;padding:10px 0 4px}.credit a{color:#b8c0cc;text-decoration:none}</style></head><body><div class="wrap"><h1>Timeline Visualizer</h1><div class="card"><input id="file" type="file" accept=".json,application/json"><div id="status" class="muted">Timeline.json을 선택하세요. 파일은 서버로 업로드되지 않습니다.</div></div><div class="card"><div class="row"><label>시작 <input id="from" type="date"></label><label>끝 <input id="to" type="date"></label></div><div class="row"><label>이름 <input id="name" value="My"></label><label>제목 <input id="title" value="{year} {name} Timeline"></label></div><div class="row"><label>재생 <input id="seconds" type="number" min="10" max="300" value="30" style="width:65px">초</label><label>화질 <select id="quality"><option value="480">480p</option><option value="720">720p</option><option value="1080" selected>1080p</option></select></label><label>카메라 <select id="camera"><option value="follow" selected>현재 위치 따라가기</option><option value="fixed">전체 경로 고정</option></select></label><label><input id="filter" type="checkbox" checked> GPS 이상치 필터</label></div><div class="row"><button id="apply" disabled>기간 적용</button><button id="play" disabled>미리보기</button><button id="image" disabled>전체 경로 이미지</button><button id="video" disabled>영상 만들기</button></div><div class="progress"><div id="bar" class="bar"></div></div></div><div id="map"></div><div class="card muted">현재 위치 주변 경로는 진한 빨강, 멀어진 과거 경로는 얇고 옅게 표시됩니다. 영상: 60 FPS.</div><div class="credit">원작자: 말러팔삼 <a href="https://x.com/mahler83" target="_blank" rel="noopener noreferrer">@mahler83</a></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id);let pts=[],shown=[];const buttons=['apply','play','image','video'];
const map=L.map('map',{zoomControl:true}).setView([37.56,126.97],7),baseLine=L.polyline([],{color:'#e88aa1',weight:3,opacity:.48,lineCap:'round',lineJoin:'round'}).addTo(map),hotLine=L.polyline([],{color:'#ef174f',weight:4,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(map),marker=L.circleMarker([0,0],{radius:7,color:'#ffadc0',fillColor:'#ef174f',fillOpacity:1,weight:3}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
function setReady(v){buttons.forEach(id=>$(id).disabled=!v)}function msg(s){$('status').textContent=s}function toMs(v){if(v==null)return NaN;if(typeof v==='number')return v<1e12?v*1000:v;let n=Number(v);return Number.isFinite(n)?(n<1e12?n*1000:n):Date.parse(v)}function parseCoord(v){if(!v)return null;if(typeof v==='object')v=v.latLng||v.point||v.location||null;if(typeof v==='string'){let m=v.match(/(-?\d+(?:\.\d+)?)\s*°?\s*,\s*(-?\d+(?:\.\d+)?)/)||v.match(/geo:(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return[+m[1],+m[2]]}return null}function addPoint(a,t,c){c=parseCoord(c);t=toMs(t);if(c&&Number.isFinite(t)&&Math.abs(c[0])<=85.05&&Math.abs(c[1])<=180)a.push({lat:c[0],lng:c[1],t})}
function parseData(data){let out=[],segs=Array.isArray(data)?data:data?.semanticSegments;if(Array.isArray(segs))for(const s of segs){let st=s?.startTime,et=s?.endTime;if(Array.isArray(s?.timelinePath))for(const p of s.timelinePath){let t=p?.time;if(!t&&p?.durationMinutesOffsetFromStartTime!=null)t=toMs(st)+Number(p.durationMinutesOffsetFromStartTime)*60000;addPoint(out,t,p?.point)}addPoint(out,st,s?.visit?.topCandidate?.placeLocation);addPoint(out,st,s?.activity?.start);addPoint(out,et,s?.activity?.end)}if(out.length)return out;function walk(o,t){if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(x=>walk(x,t));return}t=o.timestamp||o.time||o.startTime||o.startTimestamp||o.duration?.startTimestamp||t;for(const k of ['latLng','location','startLocation','point'])if(o[k])addPoint(out,t,o[k]);if(o.latitudeE7!=null&&o.longitudeE7!=null)addPoint(out,t,`${o.latitudeE7/1e7},${o.longitudeE7/1e7}`);if(o.latitude!=null&&o.longitude!=null)addPoint(out,t,`${o.latitude},${o.longitude}`);for(const v of Object.values(o))walk(v,t)}walk(data,null);return out}
function hav(a,b){let R=6371,p=Math.PI/180,dlat=(b.lat-a.lat)*p,dl=(b.lng-a.lng)*p,s=Math.sin(dlat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(s))}function distance(a,n=a.length){let d=0;for(let i=1;i<n;i++)d+=hav(a[i-1],a[i]);return d}function filtered(a){if(!$('filter').checked||a.length<3)return a;return a.filter((p,i)=>!i||i===a.length-1||((hav(a[i-1],p)+hav(p,a[i+1]))/Math.max(1,(a[i+1].t-a[i-1].t)/3600000)<1200))}
function styleForDistance(km){const near=35,far=180;if(km<=near)return{alpha:.92,w:1};let t=Math.min(1,(km-near)/(far-near));return{alpha:.92-(.62*t),w:1-(.48*t)}}function hotStart(a,n){if(!n)return 0;let p=a[n-1],i=n-1;while(i>0&&hav(a[i],p)<35)i--;return i}
function apply(){if(!pts.length)return;let f=$('from').value?new Date($('from').value+'T00:00:00').getTime():0,t=$('to').value?new Date($('to').value+'T23:59:59.999').getTime():Infinity;shown=filtered(pts.filter(p=>p.t>=f&&p.t<=t));baseLine.setLatLngs(shown.map(p=>[p.lat,p.lng]));hotLine.setLatLngs([]);if(shown.length){map.fitBounds(baseLine.getBounds(),{padding:[20,20]});marker.setLatLng([shown[0].lat,shown[0].lng]);msg(`${shown.length.toLocaleString()}개 위치 · ${Math.round(distance(shown)).toLocaleString()} km`)}else msg('선택한 기간에 표시할 위치가 없습니다.')}
$('file').onchange=async e=>{setReady(false);try{let file=e.target.files?.[0];if(!file)return;if(file.size>250*1024*1024)throw Error('파일이 너무 큽니다.');msg('파일을 읽는 중...');let a=parseData(JSON.parse(await file.text()));pts=a.filter(p=>Number.isFinite(p.t)).sort((x,y)=>x.t-y.t).filter((p,i,r)=>!i||p.t!==r[i-1].t||p.lat!==r[i-1].lat||p.lng!==r[i-1].lng);if(!pts.length)throw Error('지원되는 위치 데이터를 찾지 못했습니다.');$('from').value=new Date(pts[0].t).toISOString().slice(0,10);$('to').value=new Date(pts.at(-1).t).toISOString().slice(0,10);setReady(true);apply()}catch(e){pts=[];shown=[];baseLine.setLatLngs([]);hotLine.setLatLngs([]);msg('불러오기 실패: '+e.message)}};$('apply').onclick=apply;$('filter').onchange=apply;
$('play').onclick=()=>{if(!shown.length)return;let st=performance.now(),dur=Math.max(3,+$('seconds').value||30)*1000;baseLine.setLatLngs([]);function f(now){let q=Math.min(1,(now-st)/dur),n=Math.max(1,Math.floor(q*shown.length)),a=shown.slice(0,n),p=a.at(-1),hs=hotStart(a,a.length);baseLine.setLatLngs(a.map(x=>[x.lat,x.lng]));hotLine.setLatLngs(a.slice(hs).map(x=>[x.lat,x.lng]));marker.setLatLng([p.lat,p.lng]);if($('camera').value==='follow')map.panTo([p.lat,p.lng],{animate:false});$('bar').style.width=q*100+'%';q<1?requestAnimationFrame(f):map.fitBounds(baseLine.getBounds(),{padding:[20,20]})}requestAnimationFrame(f)};
function canvas(){let s=+$('quality').value,c=document.createElement('canvas');c.width=c.height=s;return c}const tileCache=new Map();function mercX(lng,z){return(lng+180)/360*2**z*256}function mercY(lat,z){let r=lat*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z*256}function bounds(a){return{minLat:Math.min(...a.map(p=>p.lat)),maxLat:Math.max(...a.map(p=>p.lat)),minLng:Math.min(...a.map(p=>p.lng)),maxLng:Math.max(...a.map(p=>p.lng))}}function chooseZoom(a,s){let b=bounds(a);for(let z=15;z>=2;z--){let w=Math.abs(mercX(b.maxLng,z)-mercX(b.minLng,z)),h=Math.abs(mercY(b.minLat,z)-mercY(b.maxLat,z));if(w<s*.68&&h<s*.62)return z}return 2}function tileUrl(z,x,y){let s=['a','b','c','d'][Math.abs(x+y)%4];return`https://${s}.basemaps.cartocdn.com/light_all/${z}/${x}/${y}.png`}function loadTile(z,x,y){let n=2**z;x=((x%n)+n)%n;if(y<0||y>=n)return Promise.resolve(null);let k=`${z}/${x}/${y}`;if(tileCache.has(k))return tileCache.get(k);let p=new Promise(r=>{let im=new Image;im.crossOrigin='anonymous';im.onload=()=>r(im);im.onerror=()=>r(null);im.src=tileUrl(z,x,y)});tileCache.set(k,p);return p}async function drawMap(ctx,s,z,c){let cx=mercX(c.lng,z),cy=mercY(c.lat,z),l=cx-s/2,t=cy-s/2,x0=Math.floor(l/256),y0=Math.floor(t/256),x1=Math.floor((l+s)/256),y1=Math.floor((t+s)/256);ctx.fillStyle='#e9eef1';ctx.fillRect(0,0,s,s);for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){let im=await loadTile(z,x,y);if(im)ctx.drawImage(im,x*256-l,y*256-t,256,256)}}function px(p,z,c,s){return[mercX(p.lng,z)-mercX(c.lng,z)+s/2,mercY(p.lat,z)-mercY(c.lat,z)+s/2]}function monthLabel(ms){return new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(ms))}function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function drawFrame(c,n,z,fixed){let ctx=c.getContext('2d'),s=c.width,p=shown[Math.max(0,n-1)],center=$('camera').value==='follow'?p:fixed;await drawMap(ctx,s,z,center);ctx.lineCap='round';ctx.lineJoin='round';for(let i=1;i<n;i++){let d=hav(shown[i-1],p),st=styleForDistance(d),a=px(shown[i-1],z,center,s),b=px(shown[i],z,center,s);ctx.strokeStyle=`rgba(239,23,79,${st.alpha})`;ctx.lineWidth=Math.max(1.5,s/215*st.w);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}let q=px(p,z,center,s);ctx.fillStyle='rgba(239,23,79,.18)';ctx.beginPath();ctx.arc(q[0],q[1],s/42,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef174f';ctx.beginPath();ctx.arc(q[0],q[1],s/90,0,Math.PI*2);ctx.fill();let cw=s*.88,ch=s*.12,x=(s-cw)/2,y=s*.035;ctx.fillStyle='rgba(255,250,252,.94)';roundRect(ctx,x,y,cw,ch,s*.025);ctx.fill();ctx.fillStyle='#171717';ctx.textAlign='center';ctx.font=`700 ${s*.045}px -apple-system`;let yr=new Date(shown[0].t).getFullYear(),tt=$('title').value.replace('{year}',yr).replace('{name}',$('name').value);ctx.fillText(tt,s/2,y+ch*.48);ctx.font=`500 ${s*.026}px -apple-system`;ctx.fillStyle='#555';ctx.fillText(`${monthLabel(p.t)}  ·  ${Math.round(distance(shown,n)).toLocaleString()} km`,s/2,y+ch*.79)}
function save(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)}$('image').onclick=async()=>{if(!shown.length)return;msg('지도 이미지 생성 중...');try{let c=canvas(),z=chooseZoom(shown,c.width),b=bounds(shown),fixed={lat:(b.minLat+b.maxLat)/2,lng:(b.minLng+b.maxLng)/2};await drawFrame(c,shown.length,z,fixed);c.toBlob(x=>x?(save(x,'timeline.png'),msg('이미지 생성 완료')):msg('이미지 생성 실패'),'image/png')}catch(e){msg('이미지 생성 실패: '+e.message)}};
$('video').onclick=async()=>{if(!shown.length)return;let c=canvas();if(!c.captureStream||typeof MediaRecorder==='undefined'){msg('이 브라우저는 웹 영상 생성을 지원하지 않습니다.');return}try{let z=chooseZoom(shown,c.width),b=bounds(shown),fixed={lat:(b.minLat+b.maxLat)/2,lng:(b.minLng+b.maxLng)/2},fps=60,dur=Math.max(10,Math.min(300,+$('seconds').value||30)),stream=c.captureStream(fps),types=['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm'],mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let type=rec.mimeType||mime||'video/webm';save(new Blob(chunks,{type}),'timeline.'+(type.includes('mp4')?'mp4':'webm'));msg('영상 생성 완료')};rec.start();let frames=Math.max(1,Math.round(dur*fps));msg('영상 생성 중...');for(let i=0;i<frames;i++){let q=i/(frames-1||1),n=Math.max(1,Math.min(shown.length,Math.floor(q*shown.length)));await drawFrame(c,n,z,fixed);$('bar').style.width=q*100+'%';await new Promise(r=>setTimeout(r,1000/fps))}rec.stop()}catch(e){msg('영상 생성 실패: '+e.message)}};</script></body></html>
