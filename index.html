<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>Timeline Visualizer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#101114;color:#f5f5f7}.wrap{max-width:760px;margin:auto;padding:16px}h1{font-size:24px}.card{background:#1c1d21;border-radius:16px;padding:14px;margin:12px 0}button,input,select{font:inherit;border:0;border-radius:10px;padding:11px;margin:4px;background:#2b2d32;color:white}button{background:#3976f6;font-weight:650;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}#map{height:48vh;min-height:330px;border-radius:14px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.muted{color:#aaa}.progress{height:5px;background:#333;border-radius:4px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#fff}.credit{text-align:center;color:#8f939b;font-size:13px;padding:10px 0 4px}.credit a{color:#b8c0cc;text-decoration:none}</style></head><body><div class="wrap"><h1>Timeline Visualizer</h1><div class="card"><input id="file" type="file" accept=".json,application/json"><div id="status" class="muted">Timeline.json을 선택하세요. 파일은 서버로 업로드되지 않습니다.</div></div><div class="card"><div class="row"><label>시작 <input id="from" type="date"></label><label>끝 <input id="to" type="date"></label></div><div class="row"><label>이름 <input id="name" value="My"></label><label>제목 <input id="title" value="{year} {name} Timeline"></label></div><div class="row"><label>재생 <input id="seconds" type="number" min="10" max="300" value="30" style="width:65px">초</label><label>화질 <select id="quality"><option value="480">480p</option><option value="720">720p</option><option value="1080" selected>1080p</option></select></label><label>카메라 <select id="camera"><option value="follow" selected>현재 위치 따라가기</option><option value="fixed">전체 경로 고정</option></select></label><label><input id="filter" type="checkbox" checked> GPS 이상치 필터</label></div><div class="row"><button id="apply" disabled>기간 적용</button><button id="play" disabled>미리보기</button><button id="image" disabled>전체 경로 이미지</button><button id="video" disabled>영상 만들기</button></div><div class="progress"><div id="bar" class="bar"></div></div></div><div id="map"></div><div class="card muted">웹 영상은 실제 지도 타일 위에 경로를 렌더링합니다. JSON은 브라우저 내부에서만 처리됩니다. 영상: 60 FPS.</div><div class="credit">원작자: 말러팔삼 <a href="https://x.com/mahler83" target="_blank" rel="noopener noreferrer">@mahler83</a></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id);let pts=[],shown=[];const buttons=['apply','play','image','video'];
const map=L.map('map',{zoomControl:true}).setView([37.56,126.97],7),line=L.polyline([],{color:'#ef174f',weight:6,opacity:.92,lineCap:'round',lineJoin:'round'}).addTo(map),marker=L.circleMarker([0,0],{radius:8,color:'#ff9ab5',fillColor:'#ef174f',fillOpacity:1,weight:5}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
function setReady(v){buttons.forEach(id=>$(id).disabled=!v)}function msg(s){$('status').textContent=s}
function parseCoord(v){if(!v)return null;if(typeof v==='object'){v=v.latLng||v.point||v.location||null;if(!v)return null}if(typeof v==='string'){let m=v.match(/(-?\d+(?:\.\d+)?)\s*°?\s*,\s*(-?\d+(?:\.\d+)?)/)||v.match(/geo:(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return[+m[1],+m[2]]}return null}
function toMs(v){if(v==null)return NaN;if(typeof v==='number')return v<1e12?v*1000:v;let n=Number(v);if(Number.isFinite(n))return n<1e12?n*1000:n;return Date.parse(v)}
function addPoint(arr,time,coord){let c=parseCoord(coord),t=toMs(time);if(c&&Number.isFinite(t)&&Math.abs(c[0])<=85.05112878&&Math.abs(c[1])<=180)arr.push({lat:c[0],lng:c[1],t})}
function parseSemantic(data){let segs=Array.isArray(data)?data:data&&Array.isArray(data.semanticSegments)?data.semanticSegments:null;if(!segs)return[];let out=[];for(const seg of segs){if(!seg||typeof seg!=='object')continue;let st=seg.startTime,et=seg.endTime;if(Array.isArray(seg.timelinePath)){for(const p of seg.timelinePath){if(!p)continue;let time=p.time;if(!time&&p.durationMinutesOffsetFromStartTime!=null&&Number.isFinite(toMs(st)))time=toMs(st)+Number(p.durationMinutesOffsetFromStartTime)*60000;addPoint(out,time,p.point)}}addPoint(out,st,seg.visit?.topCandidate?.placeLocation);addPoint(out,st,seg.activity?.start);addPoint(out,et,seg.activity?.end)}return out}
function parseFallback(data){let out=[];function walk(o,t){if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(x=>walk(x,t));return}let time=o.timestamp||o.time||o.startTime||o.startTimestamp||o.duration?.startTimestamp||o.duration?.startTimestampMs||t;for(const k of ['latLng','location','startLocation','point'])if(o[k])addPoint(out,time,o[k]);if(o.latitudeE7!=null&&o.longitudeE7!=null)addPoint(out,time,`${o.latitudeE7/1e7}, ${o.longitudeE7/1e7}`);if(o.latitude!=null&&o.longitude!=null)addPoint(out,time,`${o.latitude}, ${o.longitude}`);for(const v of Object.values(o))walk(v,time)}walk(data,null);return out}
function hav(a,b){let R=6371,p=Math.PI/180,dlat=(b.lat-a.lat)*p,dl=(b.lng-a.lng)*p,s=Math.sin(dlat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function distance(a,n=a.length){let d=0;for(let i=1;i<n;i++)d+=hav(a[i-1],a[i]);return d}
function filtered(a){if(!$('filter').checked||a.length<3)return a;return a.filter((p,i)=>{if(!i||i===a.length-1)return true;let dt=Math.max(1,(a[i+1].t-a[i-1].t)/3600000),d=hav(a[i-1],p)+hav(p,a[i+1]);return d/dt<1200})}
function apply(){if(!pts.length){msg('먼저 Timeline JSON 파일을 선택하세요.');return}let f=$('from').value?new Date($('from').value+'T00:00:00').getTime():0,t=$('to').value?new Date($('to').value+'T23:59:59.999').getTime():Infinity;shown=filtered(pts.filter(p=>p.t>=f&&p.t<=t));line.setLatLngs(shown.map(p=>[p.lat,p.lng]));if(shown.length){map.fitBounds(line.getBounds(),{padding:[20,20]});marker.setLatLng([shown[0].lat,shown[0].lng]);msg(`${shown.length.toLocaleString()}개 위치 · ${Math.round(distance(shown)).toLocaleString()} km`)}else msg('선택한 기간에 표시할 위치가 없습니다.')}
$('file').addEventListener('change',async e=>{setReady(false);$('bar').style.width='0';try{let file=e.target.files?.[0];if(!file)return;if(file.size>250*1024*1024)throw new Error('파일이 너무 큽니다 (250MB 이하 권장).');msg('파일을 읽는 중...');let data=JSON.parse(await file.text());let parsed=parseSemantic(data);if(!parsed.length)parsed=parseFallback(data);pts=parsed.filter(p=>Number.isFinite(p.t)).sort((a,b)=>a.t-b.t).filter((p,i,a)=>!i||p.t!==a[i-1].t||p.lat!==a[i-1].lat||p.lng!==a[i-1].lng);if(!pts.length)throw new Error('지원되는 위치 데이터를 찾지 못했습니다.');let a=new Date(pts[0].t),b=new Date(pts[pts.length-1].t);$('from').value=a.toISOString().slice(0,10);$('to').value=b.toISOString().slice(0,10);setReady(true);apply()}catch(err){pts=[];shown=[];line.setLatLngs([]);msg('불러오기 실패: '+err.message)}});
$('apply').onclick=apply;$('filter').onchange=apply;
$('play').onclick=()=>{if(!shown.length)return;let start=performance.now(),dur=Math.max(3,+$('seconds').value||30)*1000;line.setLatLngs([]);function f(now){let q=Math.min(1,(now-start)/dur),n=Math.max(1,Math.floor(q*shown.length)),a=shown.slice(0,n);line.setLatLngs(a.map(p=>[p.lat,p.lng]));let p=a[a.length-1];marker.setLatLng([p.lat,p.lng]);if($('camera').value==='follow')map.panTo([p.lat,p.lng],{animate:false});$('bar').style.width=q*100+'%';if(q<1)requestAnimationFrame(f);else map.fitBounds(line.getBounds(),{padding:[20,20]})}requestAnimationFrame(f)};
function canvas(){let s=+$('quality').value,c=document.createElement('canvas');c.width=c.height=s;return c}
const tileCache=new Map();function mercX(lng,z){return (lng+180)/360*Math.pow(2,z)*256}function mercY(lat,z){let r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)*256}
function routeBounds(a){return{minLat:Math.min(...a.map(p=>p.lat)),maxLat:Math.max(...a.map(p=>p.lat)),minLng:Math.min(...a.map(p=>p.lng)),maxLng:Math.max(...a.map(p=>p.lng))}}
function chooseZoom(a,size){let b=routeBounds(a);for(let z=15;z>=2;z--){let w=Math.abs(mercX(b.maxLng,z)-mercX(b.minLng,z)),h=Math.abs(mercY(b.minLat,z)-mercY(b.maxLat,z));if(w<size*.68&&h<size*.62)return z}return 2}
function tileUrl(z,x,y){let s=['a','b','c','d'][Math.abs(x+y)%4];return`https://${s}.basemaps.cartocdn.com/light_all/${z}/${x}/${y}.png`}
function loadTile(z,x,y){let n=Math.pow(2,z);x=((x%n)+n)%n;if(y<0||y>=n)return Promise.resolve(null);let k=`${z}/${x}/${y}`;if(tileCache.has(k))return tileCache.get(k);let p=new Promise(res=>{let im=new Image;im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=tileUrl(z,x,y)});tileCache.set(k,p);return p}
async function preloadTiles(a,z,size){let b=routeBounds(a),pad=size*.7,minX=Math.floor((mercX(b.minLng,z)-pad)/256),maxX=Math.floor((mercX(b.maxLng,z)+pad)/256),minY=Math.floor((mercY(b.maxLat,z)-pad)/256),maxY=Math.floor((mercY(b.minLat,z)+pad)/256),jobs=[];for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++)jobs.push(loadTile(z,x,y));await Promise.all(jobs)}
async function drawMapBase(ctx,size,z,center){let cx=mercX(center.lng,z),cy=mercY(center.lat,z),left=cx-size/2,top=cy-size/2,x0=Math.floor(left/256),y0=Math.floor(top/256),x1=Math.floor((left+size)/256),y1=Math.floor((top+size)/256);ctx.fillStyle='#e9eef1';ctx.fillRect(0,0,size,size);for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){let im=await loadTile(z,tx,ty);if(im)ctx.drawImage(im,tx*256-left,ty*256-top,256,256)}}
function pointPx(p,z,center,size){return[mercX(p.lng,z)-mercX(center.lng,z)+size/2,mercY(p.lat,z)-mercY(center.lat,z)+size/2]}
function monthLabel(ms){return new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(ms))}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function drawFrame(c,n,z,fixedCenter){let ctx=c.getContext('2d'),size=c.width,p=shown[Math.max(0,n-1)],center=$('camera').value==='follow'?p:fixedCenter;await drawMapBase(ctx,size,z,center);let start=Math.max(0,n-5000);ctx.strokeStyle='#ef174f';ctx.lineWidth=Math.max(8,size/80);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();for(let i=start;i<n;i++){let q=pointPx(shown[i],z,center,size);i===start?ctx.moveTo(q[0],q[1]):ctx.lineTo(q[0],q[1])}ctx.stroke();if(p){let q=pointPx(p,z,center,size);ctx.fillStyle='rgba(239,23,79,.22)';ctx.beginPath();ctx.arc(q[0],q[1],size/34,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef174f';ctx.beginPath();ctx.arc(q[0],q[1],size/64,0,Math.PI*2);ctx.fill()}let cardW=size*.88,cardH=size*.12,x=(size-cardW)/2,y=size*.035;ctx.fillStyle='rgba(255,250,252,.94)';roundRect(ctx,x,y,cardW,cardH,size*.025);ctx.fill();ctx.fillStyle='#171717';ctx.textAlign='center';ctx.font=`700 ${size*.045}px -apple-system`;let yr=new Date(shown[0].t).getFullYear(),title=$('title').value.replace('{year}',yr).replace('{name}',$('name').value);ctx.fillText(title,size/2,y+cardH*.48);ctx.font=`500 ${size*.026}px -apple-system`;ctx.fillStyle='#555';ctx.fillText(`${monthLabel(p.t)}  ·  ${Math.round(distance(shown,n)).toLocaleString()} km`,size/2,y+cardH*.79)}
async function renderStill(){let c=canvas(),z=chooseZoom(shown,c.width),b=routeBounds(shown),center={lat:(b.minLat+b.maxLat)/2,lng:(b.minLng+b.maxLng)/2};await preloadTiles(shown,z,c.width);await drawFrame(c,shown.length,z,center);return c}
function save(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
$('image').onclick=async()=>{if(!shown.length)return;msg('지도 이미지 생성 중...');try{let c=await renderStill();c.toBlob(b=>b?(save(b,'timeline.png'),msg('이미지 생성 완료')):msg('이미지 생성 실패'),'image/png')}catch(e){msg('이미지 생성 실패: '+e.message)}};
$('video').onclick=async()=>{if(!shown.length)return;let c=canvas();if(!c.captureStream||typeof MediaRecorder==='undefined'){msg('이 브라우저는 웹 영상 생성을 지원하지 않습니다.');return}try{let z=chooseZoom(shown,c.width),b=routeBounds(shown),fixed={lat:(b.minLat+b.maxLat)/2,lng:(b.minLng+b.maxLng)/2};msg('지도 타일 준비 중...');await preloadTiles(shown,z,c.width);let fps=60,dur=Math.max(10,Math.min(300,+$('seconds').value||30)),stream=c.captureStream(fps),types=['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm'],mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'',rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let type=rec.mimeType||mime||'video/webm';save(new Blob(chunks,{type}),'timeline.'+(type.includes('mp4')?'mp4':'webm'));msg('영상 생성 완료')};rec.start();let frames=Math.max(1,Math.round(dur*fps));msg('영상 생성 중...');for(let i=0;i<frames;i++){let q=i/(frames-1||1),n=Math.max(1,Math.min(shown.length,Math.floor(q*shown.length)));await drawFrame(c,n,z,fixed);$('bar').style.width=(q*100)+'%';await new Promise(r=>setTimeout(r,1000/fps))}rec.stop()}catch(e){msg('영상 생성 실패: '+e.message)}};
</script></body></html>
